name: Asset API test

on:
  push:
    branches: [claude/brave-gates-spmwsv]
    paths: ["scripts/**", ".github/workflows/api-test.yml"]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run assets:typecheck
      - name: Run assets:test
        # Report API status without failing the job so the log is easy to read.
        run: |
          cp .env.example .env
          npm run assets:test || echo "::warning::일부 API 엔드포인트가 실패했습니다 (위 로그 참고)"
      - name: Inspect sprite data
        run: npm run assets:inspect
      - name: Collect 10 items (smoke test)
        run: npm run assets:collect -- --limit=10
      - name: Render proxy end-to-end (real API)
        run: |
          npm run assets:collect -- --category=body --limit=2
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:5173/ && break; sleep 1; done
          HEAD_ID=$(node -e 'console.log(Object.keys(require("./data/items/body.json"))[0])')
          SKIN_ID=$((HEAD_ID - 10000))
          echo "first skin head id: $HEAD_ID -> skin id $SKIN_ID"
          for p in "2000/30000,20000/stand1/0" "2000//stand1/0" "$SKIN_ID/30000,20000/stand1/0" "2000/30000,20000/walk1/0" "2000/30000,20000/stand1/0"; do
            curl -s -o /dev/null -w "/render/character/$p.png -> %{http_code} %{content_type} %{size_download}B %{time_total}s\n" "http://localhost:5173/render/character/$p.png"
          done
          ls -la assets/renders/*/
          grep render-proxy vite.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            data/
            assets/items/
